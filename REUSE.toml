version = 1

# First-party files that cannot carry a comment header (or where a header
# would break the format). A file that has its own header keeps only that
# ("closest"), so nothing here adds a second licence to a file.
[[annotations]]
path = [
  "**.md", "**.svg", "**.png", "**.json", "**.tsv", "**.txt", "**.webmanifest",
  "**.html", "**.gitignore", ".gitignore", "Cargo.lock", "rust/Cargo.lock",
  "sbom/**", "library/**", "docs/**",
  "etc/**", "home/**", "boot/**", "kernel/**", "packages/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (C) 2026 Paul Lambert"
SPDX-License-Identifier = "GPL-3.0-or-later OR LicenseRef-Commercial"

# Unmodified captures from a Raspberry Pi image (see NOTICE.md).
# Only these paths are LicenseRef-System-Snapshot; they are not first-party code.
[[annotations]]
path = [
  "packages/*", "kernel/configs/*", "kernel/snapshots/*", "boot/issue.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (C) 2026 Paul Lambert"
SPDX-License-Identifier = "LicenseRef-System-Snapshot"

# Self-hosted fonts and their licence texts (SIL OFL 1.1).
[[annotations]]
path = "rust/crates/pilabd/web/fonts/outfit-*"
precedence = "override"
SPDX-FileCopyrightText = "2021 The Outfit Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "rust/crates/pilabd/web/fonts/inter-*"
precedence = "override"
SPDX-FileCopyrightText = "The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "rust/crates/pilabd/web/fonts/ibm-plex-mono-*"
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "rust/crates/pilabd/web/fonts/LICENSE-*.txt"
precedence = "override"
SPDX-FileCopyrightText = "The respective font project authors"
SPDX-License-Identifier = "OFL-1.1"

# The stock licence texts.
[[annotations]]
path = "LICENSE"
precedence = "override"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "hardware/LICENSE-HARDWARE"
precedence = "override"
SPDX-FileCopyrightText = "2020 CERN"
SPDX-License-Identifier = "CERN-OHL-S-2.0"
