# Install as /etc/systemd/journald.conf.d/persistent.conf and restart systemd-journald.
[Journal]
Storage=persistent
# The SD card is small and slow: cap the journal and leave room for recordings.
SystemMaxUse=200M
SystemKeepFree=2G
MaxRetentionSec=1month
