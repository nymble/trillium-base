// pilab AirPlay receiver (shairport-sync 5.x, AirPlay 2)
// Full reference: /etc/shairport-sync.conf.sample
general =
{
	name = "pilab";
	service_type = "airplay2"; // needs nqptp.service; never fall back to classic silently
	output_backend = "pipewire";
	mdns_backend = "avahi";
	interpolation = "soxr";
	volume_range_db = 60;
	default_airplay_volume = -24.0;
};

sessioncontrol =
{
	allow_session_interruption = "yes";
	session_timeout = 60;
};

pipewire =
{
	application_name = "AirPlay (pilab)";
	node_name = "airplay-receiver";
	// Follow the default sink (the DAC) so it mixes with the synths.
	// Fixed at the graph rate so the DAC never switches rate mid-session.
	output_rate = 48000;
};

diagnostics =
{
	log_verbosity = 0;
};
