# App manifest, schema 1 (docs/app-manager.md). Installed to /etc/trillium/apps.d/.
schema = 1

[app]
id = "airplay-receiver"
name = "AirPlay receiver"
version = "5.6.3"
license = "MIT"
summary = "Phones and Macs on the network can play audio to the DAC (AirPlay 2, shairport-sync with nqptp)"
kind = "audio"
source = "local-build"
homepage = "https://github.com/mikebrady/shairport-sync"

[service]
unit = "shairport-sync.service"
scope = "user"
requires = [{ unit = "nqptp.service", scope = "system" }]

[resources]
rt_class = "soft"
cpus = "0-2"
memory_max = "256M"

[[network]]
proto = "tcp"
port = 7000
exposure = "lan"
note = "AirPlay control and audio"

[[network]]
proto = "udp"
port = 319
exposure = "lan"
note = "PTP event (nqptp)"

[[network]]
proto = "udp"
port = 320
exposure = "lan"
note = "PTP general (nqptp)"

[audio]
nodes = ["shairport-sync"]
autoconnect = [{ from = "shairport-sync:output_*", to = "Built-in Audio Stereo:playback_*" }]

[security]
risk = "Anyone on this network can play audio through the DAC, including its headphone output, unless a shairport-sync password or access list is set. nqptp (the timing daemon) listens on UDP 319 and 320 as a dynamic unprivileged user."
needs_root = false
hardening = "basic"
