# App manifest, schema 1 (docs/app-manager.md). Installed to /etc/trillium/apps.d/.
schema = 1

[app]
id = "fluidsynth"
name = "FluidSynth (General MIDI)"
version = "2.4.4"
license = "LGPL-2.1-or-later"
summary = "SoundFont 2 player for full General MIDI files and keyboards; uses FluidR3_GM (MIT) or TimGM6mb (GPL-2.0) from apt"
kind = "audio"
source = "apt"
homepage = "https://www.fluidsynth.org"

# Started and stopped by pilabd (Sounds & apps, or a scene that uses it as its engine).
# MIDI comes from the MIDI router; audio goes into Trillium Synth:engine_l/r, so the master
# level and the limiter apply.

[service]
unit = "pilab-fluidsynth.service"
scope = "user"

[resources]
rt_class = "soft"
cpus = "0-2"
memory_max = "512M"

[audio]
nodes = ["fluidsynth"]

[security]
risk = "Plays SoundFont files; open only files you trust. Its command server runs inside the unit's private network namespace, so nothing listens on the LAN."
hardening = "none"
