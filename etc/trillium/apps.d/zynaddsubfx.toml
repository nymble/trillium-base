# App manifest, schema 1 (docs/app-manager.md). Installed to /etc/trillium/apps.d/.
schema = 1

[app]
id = "zynaddsubfx"
name = "ZynAddSubFX"
version = "3.0.6"
license = "GPL-2.0-or-later"
summary = "Additive, subtractive and pad synthesizer with hundreds of bundled banks (zynaddsubfx-data); headless or with its GUI"
kind = "audio"
source = "apt"
homepage = "https://zynaddsubfx.sourceforge.io"

# Started and stopped by pilabd (Sounds & apps, or a scene that uses it as its engine).
# MIDI comes from the MIDI router; audio goes into Trillium Synth:engine_l/r, so the master
# level and the limiter apply.

[service]
unit = "pilab-zynaddsubfx.service"
scope = "user"

[resources]
rt_class = "soft"
cpus = "0-2"
memory_max = "768M"

[audio]
nodes = ["zynaddsubfx"]

[security]
risk = "Loads instrument and parameter files; open only files you trust. Its OSC (UDP) port is inside the unit's private network namespace, so nothing listens on the LAN."
hardening = "none"
