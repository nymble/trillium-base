# pilab AirPlay sender: a separate PipeWire client process that discovers
# AirPlay (RAOP) speakers on the LAN and exposes each one as an Audio/Sink.
# Runs as the user unit pilab-airplay-sender.service so toggling it never
# restarts the main realtime PipeWire graph.
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
        args = { rt.prio = 20 }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-raop-discover
        args = {
            stream.rules = [
                {   matches = [ { raop.ip = "~.*" } ]
                    actions = {
                        create-stream = {
                            stream.props = {
                                media.class = "Audio/Sink"
                                # Never let WirePlumber pick a network speaker as the default.
                                priority.session = 100
                                priority.driver = 100
                            }
                        }
                    }
                }
            ]
        }
    }
]
