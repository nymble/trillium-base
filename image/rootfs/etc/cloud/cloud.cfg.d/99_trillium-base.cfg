# Trillium Base image: cloud-init reads Raspberry Pi Imager customisation or a hand-written
# `user-data` from the boot partition (NoCloud). Used for SSH public keys, user, timezone and
# locale. The unit names itself tbase-xxxx (tbase-hostname.service), so cloud-init does not
# manage the hostname. Networking stays with systemd-networkd (DHCP on Ethernet).
datasource_list: [ NoCloud, None ]
datasource:
  NoCloud:
    seedfrom: file:///boot/firmware/
preserve_hostname: true
network:
  config: disabled
ssh:
  emit_keys_to_console: false
no_ssh_fingerprints: true
# Host keys are generated per unit by ssh-hostkeys-generate.service.
ssh_deletekeys: false
ssh_genkeytypes: []
# Grow the root partition and filesystem to the card size on first boot.
growpart:
  mode: auto
  devices: ['/']
resize_rootfs: true
