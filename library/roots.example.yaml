# Example library roots registry. The console owns the real file at
# /etc/pilab/library/roots.yaml (root-owned, 0644). Credentials never go here:
# credentials_ref names a root-only file under /etc/pilab/secrets/ (mode 0600).
#
# kind:        base | drive | smb | nfs | ssh | http | pilab
# trust:       image   built and signed with the image
#              owned   a disk physically attached to this unit
#              home    a host on the owner's home LAN, verified by host key or server id
#              venue   a venue or guest network; read-only, no credentials, explicit OK each time
#              public  internet; only through the pack installer (checksum + licence check)
# network_profiles: which network profiles may activate this root (see docs/library.md)
# mount:       never | on-demand | at-boot

schema: pilab.roots/v1

roots:

  - id: base
    kind: base
    path: /usr/share/pilab/library
    types: [waveforms, samples, presets, books]
    read_only: true
    trust: image
    mount: at-boot
    network_profiles: [any]
    risk: "None. Part of the image; read-only."

  - id: drive
    kind: drive
    device: UUID=0000-EXAMPLE        # existing, non-empty disk; UUID pinned when added in the console
    mountpoint: /mnt/pilab-drive
    path: /mnt/pilab-drive/pilab-library   # pilab works only inside this folder; bind-mounted at /srv/library
    write_scope: pilab-library/      # nothing outside it is read, listed, moved or deleted
    never_format: true               # no mkfs, repartition, relabel, fsck -y, chown of the disk root
    types: [waveforms, samples, soundfont, dataset, books, recordings, presets]
    read_only: false
    trust: owned
    mount: at-boot
    options: [nofail, noexec, nodev, nosuid, noatime]
    network_profiles: [any]
    cache_budget_gib: 200            # capped by free space, not disk size
    free_space_floor: "min(10%, 20GiB)"  # stop writing below this so other data keeps room
    risk: "Shared disk with other data. pilab stays inside pilab-library/. Anyone with physical access can unplug and read it."

  - id: nas-media
    kind: smb
    host: nas.local
    share: Media
    subpaths: [Sounds, Books]        # example layout; adjust to your share
    path: /mnt/net/nas-media
    types: [samples, soundfont, books, music]
    read_only: true
    canonical: true                  # NAS is the master for anything mirrored from here
    trust: home
    mount: on-demand                 # systemd automount, unmounts after 10 min idle
    network_profiles: [home]
    smb: { version: "3.1.1", seal: true, signing: required }
    credentials_ref: nas-media-ro    # separate read-only NAS account, never the owner's own login
    risk: "Read-only home share. Never mounted on venue or unknown networks; credentials stay on this unit."

  - id: nas-archive-recordings
    kind: smb
    host: nas.local
    share: Archive
    subpaths: [recordings]
    path: /mnt/net/nas-archive-recordings
    types: [recordings]
    read_only: false                 # push only, into recordings/{record-id}/
    enabled: false                   # needs its own NAS account limited to that folder; off by default
    trust: home
    mount: on-demand
    network_profiles: [home]
    smb: { version: "3.1.1", seal: true, signing: required }
    credentials_ref: nas-archive-pilab
    risk: "Writes recordings to the NAS Archive. Scoped account; nothing else on Archive is visible."

  - id: mac-studio-share
    kind: ssh                        # rsync over SSH; no SMB or AFP to a laptop
    host: studio-mac.local
    user: pilab-sync
    path: ~/PilabShare
    types: [samples, recordings]
    read_only: true
    trust: home
    mount: never                     # fetch with rsync only; nothing is mounted
    network_profiles: [home]
    host_key_ref: studio-mac         # pinned host key; refuse on mismatch
    credentials_ref: pilab-sync-key
    risk: "Pulls files from a laptop on the home LAN. Pinned host key; refuses on a new key."

  - id: pilab-peer
    kind: pilab                      # another pilab or a ZPOD serving its manifests over HTTPS
    host: pilab-2.local
    url: https://pilab-2.local:8443/library/
    types: [waveforms, samples, presets]
    read_only: true
    trust: home
    mount: never
    network_profiles: [home, venue]
    pinned_cert_ref: pilab-2
    risk: "Read-only manifests and files from a paired unit. Pairing pins its certificate; unpaired peers only show in discovery."

  - id: packs-internet
    kind: http
    url: https://packs.example.invalid/pilab/
    types: [samples, soundfont, waveforms, books, music, dataset]
    read_only: true
    trust: public
    mount: never
    network_profiles: [home]
    risk: "Internet download. Only through the pack installer: signed index, sha256 per file, licence must be allowed in sources.yaml."
