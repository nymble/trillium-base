[workspace]
resolver = "2"
members = ["crates/pilab-synth", "crates/pilab-core", "crates/pilabd"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later OR LicenseRef-Commercial"
repository = "https://github.com/nymble/trillium-base"
rust-version = "1.80"

[workspace.dependencies]
# ZPOD shared crates (GPL-3.0-or-later OR LicenseRef-Commercial), pinned read-only to tag
# licenses-dual-mofn (2dedb10, branch test8). Not forked. Older revisions are MIT; do not pin them.
zpod-voices = { git = "https://github.com/nymble/zpod", rev = "2dedb10863d3d9dbc6d312504faaafaf637c71e0" }
zpod-midi = { git = "https://github.com/nymble/zpod", rev = "2dedb10863d3d9dbc6d312504faaafaf637c71e0" }
zpod-music-core = { git = "https://github.com/nymble/zpod", rev = "2dedb10863d3d9dbc6d312504faaafaf637c71e0" }
pilab-synth = { path = "crates/pilab-synth" }
pilab-core = { path = "crates/pilab-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rtrb = "0.3"
libc = "0.2"
claxon = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
